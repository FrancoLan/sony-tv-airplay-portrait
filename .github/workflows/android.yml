name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-build:
    name: Guard build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: AirPlayGuard/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's legacy default also requests the removed `tools` package.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check patch whitespace
        run: git diff --check origin/main...

      - name: Test and build AirPlayGuard
        working-directory: AirPlayGuard
        run: ./gradlew --no-daemon test assembleRelease

      - name: Upload AirPlayGuard APK
        uses: actions/upload-artifact@v7
        with:
          name: airplay-guard-${{ github.sha }}
          path: AirPlayGuard/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
